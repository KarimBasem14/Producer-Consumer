<div class="top-bar">
  <div class="control-group">
    <div class="button-strip">
      @if (simService.status() !== 'running') {
      <button
        (click)="startSimulation()"
        class="control-btn control-btn-success"
        [disabled]="simService.queues().length === 0"
      >
        <lucide-icon [name]="Play" size="16"></lucide-icon>
        <span>Start</span>
      </button>
      } @else {
      <button (click)="pauseSimulation()" class="control-btn pause-btn">
        <lucide-icon [name]="Pause" size="16"></lucide-icon>
        <span>Pause</span>
      </button>
      }

      <button
        (click)="stopSimulation()"
        class="control-btn control-btn-secondary"
        [disabled]="simService.status() === 'stopped'"
      >
        <lucide-icon [name]="Square" size="16"></lucide-icon>
        <span>Stop</span>
      </button>

      <button (click)="resetSimulation()" class="control-btn control-btn-secondary">
        <lucide-icon [name]="RotateCcw" size="16"></lucide-icon>
        <span>Reset</span>
      </button>
    </div>

    <div class="divider"></div>
  </div>

  <div class="status-container">
    <div class="status-badge" [class]="'status-' + simService.status()">
      {{ simService.status().toUpperCase() }}
    </div>
  </div>
</div>
